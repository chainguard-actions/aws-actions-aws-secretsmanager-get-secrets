name: Test name-transformation option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with lowercase name-transformation expecting failure
        id: action-lower
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          secret-ids: my-test-secret
          name-transformation: lowercase

      - name: Assert lowercase transformation action failed (no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action-lower.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid AWS credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without valid AWS credentials"

      - name: Run action with none name-transformation expecting failure
        id: action-none
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          secret-ids: my-test-secret
          name-transformation: none

      - name: Assert none transformation action failed (no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action-none.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid AWS credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without valid AWS credentials"
