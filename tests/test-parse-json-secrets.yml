name: Test parse-json-secrets flag with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with parse-json-secrets=true (expect failure due to invalid credentials)
        id: action
        uses: .
        with:
          secret-ids: my-json-secret
          parse-json-secrets: 'true'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        continue-on-error: true

      - name: Assert action failed (invalid credentials, parse-json-secrets=true path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials (parse-json-secrets=true), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid AWS credentials with parse-json-secrets=true"
