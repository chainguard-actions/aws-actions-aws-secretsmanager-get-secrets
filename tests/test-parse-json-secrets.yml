name: Test - Parse JSON Secrets Option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with parse-json-secrets enabled (expect failure due to invalid creds)
        id: action
        uses: .
        with:
          secret-ids: 'test/json-secret'
          parse-json-secrets: 'true'
          name-transformation: 'uppercase'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        continue-on-error: true

      - name: Assert action failed (invalid creds, parse-json-secrets input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to AWS credential issues, not due to
          # invalid parse-json-secrets input (which would be a different error).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid AWS credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (parse-json-secrets=true input accepted, AWS call failed as expected)"
