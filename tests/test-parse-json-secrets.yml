name: Test parse-json-secrets option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          secret-ids: |
            MY_JSON_SECRET,arn:aws:secretsmanager:us-east-1:123456789012:secret:my-json-secret-abcdef
          parse-json-secrets: 'true'
      - name: Assert action ran with parse-json-secrets (succeeds with real creds, fails gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with parse-json-secrets=true (real AWS credentials available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real AWS credentials in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
