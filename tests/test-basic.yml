name: Test basic secret retrieval
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect AWS auth failure, not config failure)
        id: action
        uses: .
        with:
          secret-ids: my-test-secret
        continue-on-error: true

      - name: Assert action ran and failed with AWS error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are fake (not because of bad config)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly attempted AWS call and failed with invalid credentials"
