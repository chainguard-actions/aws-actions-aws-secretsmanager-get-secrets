name: Test basic secret retrieval
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-secrets
        uses: .
        with:
          secret-ids: my-test-secret
          parse-json-secrets: 'false'
          name-transformation: uppercase
        continue-on-error: true
      - name: Assert action ran (expected to fail without real AWS credentials)
        env:
          OUTCOME: ${{ steps.get-secrets.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with secret-ids input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
