name: Test - Empty Secret IDs Completes Successfully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with empty secret-ids (expect success - no secrets to fetch)
        id: action
        uses: .
        with:
          secret-ids: ''
          parse-json-secrets: 'false'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action succeeded with empty secret-ids (no secrets to fetch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With empty secret-ids, the action has nothing to fetch and completes successfully
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with empty secret-ids (nothing to fetch), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly succeeded when given empty secret-ids"
