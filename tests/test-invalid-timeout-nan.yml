name: Test non-numeric auto-select-family-attempt-timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-numeric timeout value
        id: action
        uses: .
        with:
          secret-ids: dummy-secret
          auto-select-family-attempt-timeout: 'not-a-number'
        continue-on-error: true

      - name: Assert action failed due to non-numeric timeout
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with non-numeric timeout value"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric timeout"
