name: Test minimum valid auto-select-family-attempt-timeout (10ms)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with minimum valid timeout of 10ms (should fail at AWS, not at validation)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          secret-ids: |
            MY_SECRET,my-test-secret
          auto-select-family-attempt-timeout: '10'

      - name: Assert action failed at AWS (not at timeout validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid AWS credentials, not because of
          # invalid timeout. Either way, the outcome is 'failure', which confirms the
          # action accepted 10 as a valid timeout (the minimum allowed value).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at AWS call), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted minimum timeout of 10ms (failed at AWS as expected)"
