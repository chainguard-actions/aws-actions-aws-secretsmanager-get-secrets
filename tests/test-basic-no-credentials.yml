name: Test basic usage without valid AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unset any AWS credentials that might be present
        run: |
          echo "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7INVALID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=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" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - id: get-secret
        uses: .
        continue-on-error: true
        with:
          secret-ids: |
            test/nonexistent/secret

      - name: Assert action failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.get-secret.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no valid AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real AWS credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
