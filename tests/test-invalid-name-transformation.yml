name: Test invalid name-transformation value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid name-transformation
        id: action
        uses: .
        with:
          secret-ids: dummy-secret
          name-transformation: 'camelcase'
        continue-on-error: true

      - name: Assert action failed due to invalid name-transformation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid name-transformation value"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid name-transformation"
