name: Test invalid name-transformation value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unsupported name-transformation (should fail)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
        with:
          secret-ids: |
            SOME_SECRET,some-secret-name
          name-transformation: 'camelcase'

      - name: Assert action failed due to invalid name-transformation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid name-transformation, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unsupported name-transformation"
