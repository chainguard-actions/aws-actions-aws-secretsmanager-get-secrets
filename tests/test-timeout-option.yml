name: Test - Auto Select Family Attempt Timeout Validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid timeout value less than 10 (expect failure)
        id: action
        uses: .
        with:
          secret-ids: 'test/my-secret'
          parse-json-secrets: 'false'
          name-transformation: 'uppercase'
          auto-select-family-attempt-timeout: '5'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        continue-on-error: true

      - name: Assert action failed due to invalid timeout (< 10)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action validates that auto-select-family-attempt-timeout >= 10.
          # A value of 5 should cause setFailed() immediately, before any AWS call.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with timeout=5 (must be >= 10), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid timeout value (5 < 10)"
