name: Test lowercase name-transformation is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with lowercase name-transformation (should fail at AWS, not at validation)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          secret-ids: |
            my_secret,my-test-secret
          name-transformation: 'lowercase'
          auto-select-family-attempt-timeout: '1000'

      - name: Assert action failed at AWS (not at name-transformation validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid AWS credentials, not because of
          # invalid name-transformation. Either way, the outcome is 'failure', which
          # confirms the action accepted 'lowercase' as a valid transformation.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at AWS call), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted lowercase name-transformation (failed at AWS as expected)"
